const LANGS = ['ko', 'en', 'ja', 'pt', 'de', 'fr'];
const pick = (code) => LANGS.find((l) => String(code || '').toLowerCase().startsWith(l));
const chosen = () => pick(new URLSearchParams(location.search).get('lang')) || pick(navigator.languages?.[0] || navigator.language) || 'en';

function show(lang) {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = TEXT[el.dataset.t]?.[lang] ?? TEXT[el.dataset.t]?.en ?? '';
  document.title = 'como – ' + TEXT['hero.title'][lang];
  document.getElementById('lang').value = lang;
  document.getElementById('privacy').href = `privacy.html?lang=${lang}`;
}

document.getElementById('mac').href = MAC_DMG;
document.getElementById('lang').addEventListener('change', (e) => {
  const lang = e.target.value;
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  history.replaceState(null, '', url);
  show(lang);
});
show(chosen());
